name: Docker Image CI

on:
  push:
    branches: [ AltoroJ-3.2 ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Docker login
      env:
        DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
      run: docker login -u snykschmidtty -p $DOCKER_PASSWORD
    - name: Build the Docker image
      run: DOCKER_BUILDKIT=1 docker build . --file Dockerfile.beta --tag snykschmidtty/altoroj:latest
    - name: Docker Push
      run: docker push snykschmidtty/altoroj:latest
